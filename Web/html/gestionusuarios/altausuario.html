<!DOCTYPE html>
<html lang="es">

<head>

</head>

<body>
    <header class="fixed">
        <h1>TaskMaster - Gestión de tareas</h1>
        <nav>
            <a href="../../index.html">Inicio</a>
            <a href="altausuario.html">Gestión de usuarios</a>
            <a href="">Gestión de tareas</a>

            <a href="mostrarusuarios.html">Mostrar usuarios</a>
        </nav>
    </header>
    <main>
        <form>
            <h2>Alta de usuario</h2>
            <label>
                ID: <br>
                <input type="number" name="number" required>
            </label>

            <label>
                Nombre: <br>
                <input type="text" name="nombre" required>
            </label>

            <label>
                Email: <br>
                <input type="email" name="email" required>
            </label>

            <label>
                Contraseña: <br>
                <input type="password" name="password" required>
            </label>

            <button type="submit">Alta de usuario</button>
        </form>
    </main>
    <footer>
        <p>José Vicente Sánchez Vargues - 1º DAM</p>
    </footer>
